<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">HockeyMONStream multi-camera sports video pipeline</title>
  <desc id="desc">Two fixed camera views flow into one stitched rink panorama where a tracker follows the cluster of players.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f2740"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecfaff"/>
      <stop offset="1" stop-color="#b8e2f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <clipPath id="left-view"><rect x="54" y="82" width="490" height="236" rx="22"/></clipPath>
    <clipPath id="right-view"><rect x="656" y="82" width="490" height="236" rx="22"/></clipPath>
    <clipPath id="panorama"><rect x="70" y="454" width="1060" height="214" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="750" rx="32" fill="url(#background)"/>
  <circle cx="990" cy="-20" r="270" fill="#2b82ff" opacity=".1"/>
  <circle cx="120" cy="700" r="230" fill="#72d9ff" opacity=".06"/>

  <g filter="url(#shadow)">
    <rect x="54" y="82" width="490" height="236" rx="22" fill="#132f49" stroke="#72d9ff" stroke-opacity=".35" stroke-width="2"/>
    <g clip-path="url(#left-view)">
      <rect x="82" y="126" width="620" height="150" rx="72" fill="url(#ice)"/>
      <path d="M330 126v150" stroke="#e24d5e" stroke-width="5" opacity=".8"/>
      <path d="M210 126v150M450 126v150" stroke="#2b82ff" stroke-width="5" opacity=".75"/>
      <circle cx="330" cy="201" r="37" fill="none" stroke="#2b82ff" stroke-width="4" opacity=".55"/>
      <g fill="#10253a">
        <circle cx="294" cy="179" r="11"/><circle cx="350" cy="216" r="11"/><circle cx="408" cy="186" r="11"/><circle cx="462" cy="226" r="11"/>
      </g>
    </g>
    <rect x="72" y="98" width="98" height="29" rx="14" fill="#07111f" opacity=".85"/>
    <text x="91" y="118" fill="#b7f04a" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">CAMERA 1</text>

    <rect x="656" y="82" width="490" height="236" rx="22" fill="#132f49" stroke="#72d9ff" stroke-opacity=".35" stroke-width="2"/>
    <g clip-path="url(#right-view)">
      <rect x="500" y="126" width="620" height="150" rx="72" fill="url(#ice)"/>
      <path d="M870 126v150" stroke="#e24d5e" stroke-width="5" opacity=".8"/>
      <path d="M750 126v150M990 126v150" stroke="#2b82ff" stroke-width="5" opacity=".75"/>
      <circle cx="870" cy="201" r="37" fill="none" stroke="#2b82ff" stroke-width="4" opacity=".55"/>
      <g fill="#10253a">
        <circle cx="738" cy="179" r="11"/><circle cx="794" cy="216" r="11"/><circle cx="852" cy="186" r="11"/><circle cx="910" cy="226" r="11"/>
      </g>
    </g>
    <rect x="674" y="98" width="98" height="29" rx="14" fill="#07111f" opacity=".85"/>
    <text x="693" y="118" fill="#b7f04a" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">CAMERA 2</text>
  </g>

  <path d="M299 342c0 48 83 47 209 73M901 342c0 48-83 47-209 73" fill="none" stroke="#72d9ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 13" opacity=".72"/>
  <rect x="514" y="382" width="172" height="48" rx="24" fill="#2b82ff"/>
  <text x="600" y="412" text-anchor="middle" fill="#07111f" font-family="system-ui,sans-serif" font-size="17" font-weight="900" letter-spacing="1">GPU STITCH</text>

  <g filter="url(#shadow)">
    <rect x="70" y="454" width="1060" height="214" rx="28" fill="url(#ice)" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
    <g clip-path="url(#panorama)">
      <path d="M600 454v214" stroke="#e24d5e" stroke-width="6" opacity=".8"/>
      <path d="M390 454v214M810 454v214" stroke="#2b82ff" stroke-width="6" opacity=".72"/>
      <circle cx="600" cy="561" r="54" fill="none" stroke="#2b82ff" stroke-width="5" opacity=".5"/>
      <path d="M108 495h984M108 627h984" stroke="#fff" stroke-width="2" opacity=".52"/>
      <g fill="#10253a">
        <circle cx="520" cy="527" r="15"/><circle cx="571" cy="578" r="15"/><circle cx="629" cy="538" r="15"/><circle cx="684" cy="586" r="15"/>
      </g>
      <circle cx="599" cy="556" r="7" fill="#e24d5e"/>
      <rect x="475" y="493" width="258" height="132" rx="12" fill="none" stroke="#87be25" stroke-width="7"/>
      <path d="M733 507h71" stroke="#87be25" stroke-width="5" stroke-linecap="round"/>
      <rect x="804" y="488" width="199" height="40" rx="20" fill="#07111f" opacity=".88"/>
      <text x="903" y="514" text-anchor="middle" fill="#b7f04a" font-family="system-ui,sans-serif" font-size="16" font-weight="850" letter-spacing="1">PLAY TRACKER</text>
    </g>
  </g>
  <text x="600" y="706" text-anchor="middle" fill="#a9b9c9" font-family="system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="2">STITCHED PANORAMA → AUTOMATIC PROGRAM VIEW</text>
</svg>
