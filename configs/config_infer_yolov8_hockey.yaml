pretrained-assets:
  - property: onnx-file
    command:
      - ../scripts/export_hm_yolov8_onnx.py
      - --output
      - "{target}"
  - property: labelfile-path
    url: https://raw.githubusercontent.com/pjreddie/darknet/master/data/coco.names

property:
  gpu-id: 0
  net-scale-factor: 0.0039215697906911373
  model-color-format: 0
  # Generated by scripts/export_hm_yolov8_onnx.py.
  onnx-file: ../pretrained/deepstream/yolov8/hm_crowdhuman_e85_yolov8_m_1984_736_b2_1984x736.onnx
  # Generated by DeepStream/TensorRT from the ONNX; do not commit this engine.
  model-engine-file: ../pretrained/deepstream/yolov8/hm_crowdhuman_e85_yolov8_m_1984_736_b2_1984x736.onnx_b2_gpu0_fp32.engine
  labelfile-path: ../pretrained/deepstream/yolov8/labels_coco.txt
  batch-size: 2
  network-mode: 0
  num-detected-classes: 80
  interval: 0
  gie-unique-id: 1
  process-mode: 1
  network-type: 0
  cluster-mode: 2
  maintain-aspect-ratio: 1
  symmetric-padding: 1
  parse-bbox-func-name: NvDsInferParseYolo
  custom-lib-path: ../lib/libnvdsinfer_custom_impl_Yolo.so

class-attrs-all:
  nms-iou-threshold: 0.45
  pre-cluster-threshold: 0.25
  topk: 300
