pretrained-assets:
  - property: onnx-file
    url: https://api.github.com/repos/cjolivier01/hstream/releases/assets/501497386
    sha256: afcc56a126d485a7f2ac7a5cb61971339872227aeece6d2d531e723615f26a49
  - property: labelfile-path
    url: https://raw.githubusercontent.com/pjreddie/darknet/master/data/coco.names
    sha256: 634a1132eb33f8091d60f2c346ababe8b905ae08387037aed883953b7329af84

property:
  gpu-id: 0
  net-scale-factor: 1
  model-color-format: 1
  # Relative to this config file's directory.
  onnx-file: ../pretrained/deepstream/yolox/yolox_s_dynamic.onnx
  # Avoid writing large engines into the repo; keep it in /tmp.
  model-engine-file: /tmp/hstream_yolox_s_b2_gpu0_fp32.engine
  labelfile-path: ../pretrained/deepstream/yolox/labels_coco.txt
  batch-size: 2
  network-mode: 0
  num-detected-classes: 80
  interval: 0
  gie-unique-id: 1
  process-mode: 1
  network-type: 0
  cluster-mode: 2
  maintain-aspect-ratio: 1
  symmetric-padding: 0
  parse-bbox-func-name: NvDsInferParseYolo
  custom-lib-path: ../lib/libnvdsinfer_custom_impl_Yolo.so
  # Let DeepStream/TensorRT build+serialize the engine from the ONNX.
  # The YOLO custom engine builder path is for Darknet-style weights and prevents engine caching here.

class-attrs-all:
  # nms-iou-threshold: 0.60
  # pre-cluster-threshold: 0.4
  nms-iou-threshold: 0.45
  pre-cluster-threshold: 0.25
  topk: 300
