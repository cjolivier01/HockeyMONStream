play-tracker:
  # Baseline-backed values are materialized from configs/baseline.yaml after
  # user, game, and CLI overlays are merged. Keep only structural/native
  # behavior here so this file cannot become a second source of defaults.

  live-boxes:
    - name: current_roi
      stop-translation-on-dir-change: 0
      stop-resizing-on-dir-change: 0
      dynamic-acceleration-scaling: 0
    - name: current_roi_aspect
      stop-translation-on-dir-change: 1
      stop-resizing-on-dir-change: 1
      dynamic-acceleration-scaling: 1.0
      sticky-translation: 1
      sticky-sizing: 1
