# Fake
sink0:
  enable: 0
  sink-id: 0
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 1
  # sync: 1
  sync: 0
  sink-id: 0
  gpu-id: 0
  nvbuf-memory-type: 0

# Render
sink1:
  enable: 0
  sink-id: 1
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 2
  sync: 1
  # sync: 0
  # source-id: 1
  sink-id: 1
  nvbuf-memory-type: 0

# Encode to file
sink2:
  enable: 1
  sink-id: 2
  # Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 3
  # link-to-demux: 1
  #1=mp4 2=mkv
  container: 2
  output-file: out-1.mkv
  #1=h264 2=h265
  codec: 2
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  #iframeinterval=10
  bitrate: 55000000
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  source-id: 0

sink3:
  enable: 1
  sink-id: 2
  # Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 3
  # link-to-demux: 1
  #1=mp4 2=mkv
  container: 2
  output-file: out-2.mkv
  #1=h264 2=h265
  codec: 2
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  #iframeinterval=10
  bitrate: 55000000
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  source-id: 1

