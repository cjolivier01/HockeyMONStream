source0:
  enable: 1
  type: 3
  num-sources: 1
  gpu-id: 0
  cuda-memory-type: 0
  source-id: 0

source1:
  enable: 1
  type: 3
  num-sources: 1
  gpu-id: 0
  cuda-memory-type: 0
  source-id: 1

source2:
  enable: 0
  type: 7
  # uri: file:///home/colivier/Videos/mlk-extreme/stitched_output-partial-with-audio.mp4
  # uri: file:///home/colivier/Videos/mlk-heat-1/GX010016.MP4
  num-sources: 1
  gpu-id: 0
  input-audio-rate: 189
  source-id: 2
  cuda-memory-type: 0

source7:
  enable: 0
  # 1: v4l2, 5: CSI
  type: 1
  config-file: dual_usb_webcams.yaml

source8:
  enable: 0
  # 1: v4l2, 5: CSI
  type: 5
  config-file: dual_imx_477_af_cams.yaml


