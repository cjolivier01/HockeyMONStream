application:
  enable-perf-measurement: 1
  perf-measurement-interval-sec: 5
  # TODO: Draw indications of subtle events like when hitting extremes and/or edge cases
  # These drawings should not interfere with normal viewing (ie don't draw in the center of the image -- maybe change the color of some text somewhere or something like that)
  subtle-event-drawing: 1
  # use-nvmultiurisrcbin: 1  < -- doesnt seem to pick this up
  ##gie-kitti-output-dir=streams
  complete-configuration: 1

tiled-display:
  enable: 0
  rows: 1
  columns: 1
  # rows: 2
  # columns: 2
  # width: 7680
  # height: 3176
  # width: 4080
  # height: 1360
  # width: 2048
  # height: 720
  # width: 1647
  # height: 740
  # width: 888
  # height: 500
  width: 3840
  height: 2160
  # width: 640
  # height: 360
  gpu-id: 0
  #(0): nvbuf-mem-default - Default memory allocated, specific to particular platform
  #(1): nvbuf-mem-cuda-pinned - Allocate Pinned/Host cuda memory, applicable for Tesla
  #(2): nvbuf-mem-cuda-device - Allocate Device cuda memory, applicable for Tesla
  #(3): nvbuf-mem-cuda-unified - Allocate Unified cuda memory, applicable for Tesla
  #(4): nvbuf-mem-surface-array - Allocate Surface Array memory, applicable for Jetson
  nvbuf-memory-type: 0

# NV_DS_SOURCE_CAMERA_V4L2 = 1,
# NV_DS_SOURCE_URI = 2
# NV_DS_SOURCE_URI_MULTIPLE = 3
# NV_DS_SOURCE_RTSP = 4
# NV_DS_SOURCE_CAMERA_CSI = 5
# NV_DS_SOURCE_AUDIO_WAV = 6
# NV_DS_SOURCE_AUDIO_URI = 7
# NV_DS_SOURCE_ALSA_SRC = 8
# NV_DS_SOURCE_IPC = 9

