hmaudio0:
  enable: 0
  # 0=default alsa source, 1=file, 2=src_bin(source-id)
  src: 2
  # source-id: 1
  # audio-location: file:///home/colivier/Videos/mlk-extreme/stitched_output-partial-with-audio.mp4
  # audio-location: /home/colivier/Videos/mlk-extreme/stitched_output-partial-with-audio.mp4
  alsa-src-device: hw:0,0
  # alsa-dest-device:
  # 0=nullsink, 1=alsa sink, 2=rtsp server, 3=file

  # Visual video
  # dest: 1
  # sink_id_is_valid: 1
  # sink-id: 0

  # File output
  # dest: 3
  # sink_id_is_valid: 1
  # sink-id: 1

  # 0=independent (this local config), 1=sink, 2=multisink
  dest: 1
  # sink-id: 2
  # 3=RTMP
  sink-id: -1
  # multi-sink-ids: 0,1,2


#
# Initial high-quality streammux
#
streammux:
  gpu-id: 0
  ##Boolean property to inform muxer that sources are live
  live-source: 0
  buffer-pool-size: 8
  batch-size: 4
  num-surfaces-per-frame: 1

  ##time out in usec, to wait after the first buffer is available
  ##to push the batch even if the complete batch is not formed
  # batched-push-timeout: 40000
  ## Set muxer output width and height

  ######################
  # 4k
  ######################
  # width: 3840
  # height: 2160

  ######################
  # Tiny
  ######################
  # width: 1784
  # height: 738

  #width: 8192
  #height: 2770

  ######################
  # GoPro 5k
  ######################
  width: 5312
  height: 2988

  # width: 4096
  # height: 1385
  # width: 4080
  # height: 1360
  # width: 7680
  # height: 3176
  ##Enable to maintain aspect ratio wrt source, and allow black borders, works
  ##along with width, height properties
  enable-padding: 0
  nvbuf-memory-type: 0
  sync-inputs: 0
