# Projection review matrix for scripts/capture_stitching_projection_frames.py.
# Paths are relative to this file. Set source_game_dir here or pass
# --source-game-dir=/path/to/game on the command line.
# Successful cases with an existing PNG are skipped on later runs. Pass
# --force to rerun them, or --clean to remove this matrix's output and exit.
version: 1
source_game_dir: null
output_dir: ../projection-review

pipeline:
  workspace: ..
  executable: bazel-bin/src/apps/pipeline-app/pipeline-app
  config_root: configs
  config: configs/ds_hockey_app_config.yaml
  timeout_seconds: 360
  max_live_canvas_dimension: 4096

# Set any threshold to zero to disable that check. Cases always run serially.
resources:
  min_available_memory_gib: 0
  min_gpu_free_memory_gib: 0
  gpu_launch_reserve_gib: 0
  min_tmp_free_gib: 0
  check_interval_seconds: 5
  headroom_wait_timeout_seconds: 120

defaults:
  mapping_backend: nona
  # Source-camera preset identifier from baseline.yaml. Cases may override it.
  camera_config: gopro-mission-1
  # Optional source-camera FOV override pair; set both or neither. horizontal is passed to
  # pto_gen -f before optimization; vertical is retained by the stitching
  # configuration but is not consumed by the current Hugin toolchain.
  camera_horizontal_fov: null
  camera_vertical_fov: null
  # Output-panorama framing passed to pano_modify after autooptimiser. HStream
  # currently exposes panorama HFOV only, although pano_modify also supports
  # an HFOVxVFOV form. Projection framing is effective only with nona.
  auto_fov: true
  horizontal_fov: 180  # Retained in metadata but ignored while auto_fov is true.
  auto_canvas: true
  auto_crop: false
  control_points: 900
  frame_count: 4
  stitch_frame_time: "00:00:00"
  max_output_width: 4096

# The 18 projections without tunable Hugin projection parameters get one
# representative AUTO-FOV case. The four parameterized projections get ten
# cases apiece, including AUTO FOV and fixed 170/180/190-degree views.
projections:
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 179), auto_canvas, auto_crop; parameters: none.
  - name: rectilinear
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: cylindrical
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: equirectangular
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: full-frame-fisheye
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 359), auto_canvas, auto_crop; parameters: none.
  - name: stereographic
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: mercator
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 179), auto_canvas, auto_crop; parameters: none.
  - name: transverse-mercator
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: sinusoidal
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: lambert-cylindrical-equal-area
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: lambert-azimuthal-equal-area
    variants:
      - {label: auto-fov, parameters: []}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: phi1
  # and phi2 standard parallels (each -90..90).
  - name: albers-equal-area-conic
    variants:
      - {label: default-auto, parameters: [0, 60]}
      - {label: default-fov170, parameters: [0, 60], auto_fov: false, horizontal_fov: 170}
      - {label: default-fov180, parameters: [0, 60], auto_fov: false, horizontal_fov: 180}
      - {label: default-fov190, parameters: [0, 60], auto_fov: false, horizontal_fov: 190}
      - {label: symmetric-wide-auto, parameters: [-45, 45]}
      - {label: northern-auto, parameters: [30, 60]}
      - {label: southern-auto, parameters: [-60, -30]}
      - {label: close-parallels-auto, parameters: [30, 40]}
      - {label: asymmetric-fov180, parameters: [-30, 60], auto_fov: false, horizontal_fov: 180}
      - {label: cropped-fov190, parameters: [15, 75], auto_fov: false, horizontal_fov: 190, auto_crop: true}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: miller-cylindrical
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 359), auto_canvas, auto_crop; parameters: none.
  - name: panini
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: architectural
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 180), auto_canvas, auto_crop; parameters: none.
  - name: orthographic
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: equisolid
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 359), auto_canvas, auto_crop; parameters: none.
  - name: equirectangular-panini
    variants:
      - {label: auto-fov, parameters: []}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum alpha + 179, capped at 360), auto_canvas,
  # auto_crop; parameters: plane angle alpha (1..179), corners switch (0 or 1).
  - name: biplane
    variants:
      - {label: default-auto, parameters: [45, 0]}
      - {label: default-fov170, parameters: [45, 0], auto_fov: false, horizontal_fov: 170}
      - {label: default-fov180, parameters: [45, 0], auto_fov: false, horizontal_fov: 180}
      - {label: default-fov190, parameters: [45, 0], auto_fov: false, horizontal_fov: 190}
      - {label: rounded-auto, parameters: [45, 1]}
      - {label: narrow-angle-auto, parameters: [15, 0]}
      - {label: wide-angle-auto, parameters: [90, 0]}
      - {label: wide-rounded-auto, parameters: [90, 1]}
      - {label: narrow-rounded-fov180, parameters: [15, 1], auto_fov: false, horizontal_fov: 180}
      - {label: retained-canvas-fov190, parameters: [60, 1], auto_fov: false, horizontal_fov: 190, auto_canvas: false}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 2*alpha + 179, capped at 360), auto_canvas,
  # auto_crop; parameter: side-plane angle alpha (1..120).
  - name: triplane
    variants:
      - {label: default-auto, parameters: [60]}
      - {label: default-fov170, parameters: [60], auto_fov: false, horizontal_fov: 170}
      - {label: default-fov180, parameters: [60], auto_fov: false, horizontal_fov: 180}
      - {label: default-fov190, parameters: [60], auto_fov: false, horizontal_fov: 190}
      - {label: narrow-auto, parameters: [20]}
      - {label: medium-auto, parameters: [45]}
      - {label: wide-auto, parameters: [90]}
      - {label: maximum-auto, parameters: [120]}
      - {label: cropped-fov180, parameters: [45], auto_fov: false, horizontal_fov: 180, auto_crop: true}
      - {label: retained-canvas-fov190, parameters: [90], auto_fov: false, horizontal_fov: 190, auto_canvas: false}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (Cmpr-dependent limit), auto_canvas, auto_crop; parameters:
  # compression Cmpr (0..150), top squeeze Tops and bottom squeeze Bots
  # (-100..100). Cmpr=100 supports the fixed 170/180/190-degree cases below.
  - name: general-panini
    variants:
      - {label: default-auto, parameters: [100, 0, 0]}
      - {label: default-fov170, parameters: [100, 0, 0], auto_fov: false, horizontal_fov: 170}
      - {label: default-fov180, parameters: [100, 0, 0], auto_fov: false, horizontal_fov: 180}
      - {label: default-fov190, parameters: [100, 0, 0], auto_fov: false, horizontal_fov: 190}
      - {label: rectilinear-like-auto, parameters: [0, 0, 0]}
      - {label: mid-compression-auto, parameters: [50, 0, 0]}
      - {label: cylindrical-like-auto, parameters: [150, 0, 0]}
      - {label: hard-squeeze-auto, parameters: [100, 50, 50]}
      - {label: soft-squeeze-fov180, parameters: [100, -50, -50], auto_fov: false, horizontal_fov: 180}
      - {label: asymmetric-cropped-fov190, parameters: [100, 40, -40], auto_fov: false, horizontal_fov: 190, auto_crop: true}

  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: thoby
    variants:
      - {label: auto-fov, parameters: []}
  # Inputs: camera_horizontal_fov, camera_vertical_fov; auto_fov,
  # horizontal_fov (maximum 360), auto_canvas, auto_crop; parameters: none.
  - name: hammer-aitoff
    variants:
      - {label: auto-fov, parameters: []}
