# Fake
sink0:
  enable: 0
  sink-id: 0
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 1
  # sync: 1
  sync: 0
  sink-id: 0
  gpu-id: 0
  nvbuf-memory-type: 0

# Render
sink1:
  enable: 0
  sink-id: 1
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 2
  sync: 1
  # sync: 0
  sink-id: 1
  nvbuf-memory-type: 0

# Encode to file
sink2:
  enable: 1
  sink-id: 2
  # Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 3
  # link-to-demux: 1
  #1=mp4 2=mkv
  container: 2
  output-file: out.mkv
  #1=h264 2=h265
  codec: 2
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  #iframeinterval=10
  bitrate: 55000000
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  source-id: 0

sink3:
  enable: 0
  sink-id: 3
  # Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 4
  #1=h264 2=h265
  codec: 1
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 1
  # bitrate: 4000000
  bitrate: 200000
  #NVBUF-MEMORY-TYPE: 0
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  # output-file: rtmp://192.168.86.52/live/test
  output-file: rtmp://a.rtmp.youtube.com/live2/0fq6-f4mc-j54z-escw-8bd9
  # iframeinterval: 60
  #
  # if sending out
  #
  # RTSP client configuration
  # rtsp-location: rtsp://DUS-MXL03531PJ:8554/hm
  # Optional authentication if needed
  # rtsp-user: username
  # rtsp-pwd: password

  # When serving
  # set below properties in case of RTSPStreaming
  rtsp-port: 8554
  udp-port: 5400

