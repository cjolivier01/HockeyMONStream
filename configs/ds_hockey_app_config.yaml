application:
  enable-perf-measurement: 1
  perf-measurement-interval-sec: 5
  ##gie-kitti-output-dir=streamscl

tiled-display:
  enable: 0
  rows: 1
  columns: 1
  # rows: 2
  # columns: 2
  # width: 7680
  # height: 3176
  # width: 4080
  # height: 1360
  # width: 2048
  # height: 720
  # width: 1280
  # height: 720
  width: 2700
  height: 1000
  # width: 6142
  # height: 2077
  # width: 640
  # height: 360
  gpu-id: 0
  #(0): nvbuf-mem-default - Default memory allocated, specific to particular platform
  #(1): nvbuf-mem-cuda-pinned - Allocate Pinned/Host cuda memory, applicable for Tesla
  #(2): nvbuf-mem-cuda-device - Allocate Device cuda memory, applicable for Tesla
  #(3): nvbuf-mem-cuda-unified - Allocate Unified cuda memory, applicable for Tesla
  #(4): nvbuf-mem-surface-array - Allocate Surface Array memory, applicable for Jetson
  nvbuf-memory-type: 0

source:
  # csv-file-path: hockey_sources.csv
  # csv-file-path: webcam_sources.csv
  csv-file-path: hockey_source_mlk-extreme.csv

  # GoPro reroute to /dev/video42
  # ffmpeg -nostdin -threads 1 -i 'udp://@0.0.0.0:8554?overrun_nonfatal=1&fifo_size=50000000' -f:v mpegts -fflags nobuffer -vf format=yuv420p -f v4l2 /dev/video42
  # csv-file-path: gopro_udp_source.csv

sink0:
  enable: 1
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 2
  sync: 1
  source-id: 0
  gpu-id: 0
  nvbuf-memory-type: 0

sink1:
  enable: 0
  type: 3
  #1=mp4 2=mkv
  container: 2
  #1=h264 2=h265
  codec: 2
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  #iframeinterval=10
  bitrate: 2000000
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  output-file: out.mp4
  source-id: 0


sink2:
  enable: 1
  #Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 4
  #1=h264 2=h265
  codec: 1
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  bitrate: 4000000
  #NVBUF-MEMORY-TYPE: 0
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0

  #
  # if sending out
  #
  # RTSP client configuration
  # rtsp-location: rtsp://DUS-MXL03531PJ:8554/hm
  # Optional authentication if needed
  # rtsp-user: username
  # rtsp-pwd: password

  # When serving
  # set below properties in case of RTSPStreaming
  rtsp-port: 8554
  udp-port: 5400

# sink2:
#   enable: 1
#   #Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
#   type: 5
#   #1=h264 2=h265
#   codec: 1
#   #encoder type 0=Hardware 1=Software
#   enc-type: 0
#   sync: 0
#   bitrate: 4000000
#   #H264 Profile - 0=Baseline 2=Main 4=High
#   #H265 Profile - 0=Main 1=Main10
#   # set profile only for hw encoder, sw encoder selects profile based on sw-preset
#   profile: 0

  #
  # if sending out
  #
  # RTSP client configuration
  # rtsp-location: rtsp://DUS-MXL03531PJ:8554/hm
  # custom-sink-plugin: "rtspclientsink location=rtsp://DUS-MXL03531PJ:8554/stream_name protocols=tcp"
  # Optional authentication if needed
  # rtsp-user: username
  # rtsp-pwd: password

  # When serving
  # set below properties in case of RTSPStreaming
  # rtsp-port: 8554
  # udp-port: 5400

osd:
  enable: 0
  gpu-id: 0
  border-width: 1
  text-size: 15
  #value changed
  text-color: 1;1;1;1
  text-bg-color: 0.3;0.3;0.3;1
  font: Serif
  show-clock: 0
  clock-x-offset: 800
  clock-y-offset: 820
  clock-text-size: 12
  clock-color: 1;0;0;0
  nvbuf-memory-type: 0

#
# Initial high-quality streammux
#
streammux:
  gpu-id: 0
  ##Boolean property to inform muxer that sources are live
  live-source: 0
  buffer-pool-size: 4
  batch-size: 4
  # num-surfaces-per-frame: 1
  ##time out in usec, to wait after the first buffer is available
  ##to push the batch even if the complete batch is not formed
  batched-push-timeout: 40000
  ## Set muxer output width and height
  # width: 1784
  # height: 738
  #width: 8192
  #height: 2770
  width: 6142
  height: 2077
  # width: 4096
  # height: 1385
  # width: 4080
  # height: 1360
  # width: 7680
  # height: 3176
  ##Enable to maintain aspect ratio wrt source, and allow black borders, works
  ##along with width, height properties
  enable-padding: 0
  nvbuf-memory-type: 0

hm-image-meta-merger:
  enable: false
  gpu-id: 0
  # has_queue: true
  # has_videoconvert: true
  nvbuf-memory-type: 0

primary-gie:
  enable: 1
  gpu-id: 0
  batch-size: 4
  #Required by the app for OSD, not a plugin property
  bbox-border-color0: 1;0;0;1
  bbox-border-color1: 0;1;1;1
  bbox-border-color2: 0;0;1;1
  bbox-border-color3: 0;1;0;1
  interval: 0
  # Only class id 0
  # infer-on-class-ids: 0
  # processing-width: 1312
  # processing-height: 480
  gie-unique-id: 1
  nvbuf-memory-type: 0
  config-file: config_infer_yolox_hockey.yaml

ds-example:
  enable: 0
  gpu-id: 0
  batch-size: 4
  # blur-objects: 1
  full-frame: 1
  processing-width: 1312
  processing-height: 480

hmvideoprep:
  # enable: false
  enable: true
  gpu-id: 0
  # has_queue: false
  # has_videoconvert: false
  # has_cameraman: true
  nvbuf-memory-type: 0
  num-output-buffers: 4
  plot-detections: 1
  plot-tracking: 1
  # dewarper portion
  # source-id: 6
  # config-file: /opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/deepstream-dewarper-test/config_dewarper_rot_matrix.txt
  config-file: config_dewarper_null.txt

ds-playtracker:
  enable: 1
  gpu-id: 0
  unique-id: 75
  draw: true
  # play-tracker-class-id: 99
  config-file: play_tracker_config.yaml

ds-fieldmask:
  enable: 1
  gpu-id: 0
  unique-id: 76
  # detection-mask: /home/colivier/Videos/ev-bs-stitched/rink_mask_0.png
  # detection-mask: /home/colivier/Videos/ev-reno-1/rink_mask_0.png
  # detection-mask: /home/colivier/Videos/mlk-extreme/rink_mask_0.png
  detection-mask: /home/colivier/Videos/mlk-extreme/rink_mask_0.png

tracker:
  enable: 1
  # For NvDCF and NvDeepSORT tracker, tracker-width and tracker-height must be a multiple of 32, respectively
  tracker-width: 960
  tracker-height: 544
  ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  # ll-config-file required to set different tracker types
  # ll-config-file: /home/colivier/src/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml
  # ll-config-file: /home/colivier/src/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvSORT.yml
  ll-config-file: /home/colivier/src/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
  # ll-config-file: /home/colivier/src/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_accuracy.yml
  # ll-config-file: /home/colivier/src/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDeepSORT.yml
  gpu-id: 0
  display-tracking-id: 1

