osd:
  enable: 0
  gpu-id: 0
  border-width: 1
  text-size: 15
  #value changed
  text-color: 1;1;1;1
  text-bg-color: 0.3;0.3;0.3;1
  font: Serif
  show-clock: 0
  clock-x-offset: 800
  clock-y-offset: 820
  clock-text-size: 12
  clock-color: 1;0;0;0
  nvbuf-memory-type: 0

#
# Initial high-quality streammux
#
streammux:
  gpu-id: 0
  ##Boolean property to inform muxer that sources are live
  live-source: 0
  buffer-pool-size: 8
  batch-size: 4
  num-surfaces-per-frame: 1

  ##time out in usec, to wait after the first buffer is available
  ##to push the batch even if the complete batch is not formed
  # batched-push-timeout: 40000
  ## Set muxer output width and height

  ######################
  # 4k
  ######################
  # width: 3840
  # height: 2160

  ######################
  # Tiny
  ######################
  # width: 1784
  # height: 738

  #width: 8192
  #height: 2770

  ######################
  # GoPro 5k
  ######################
  width: 5312
  height: 2988

  # width: 4096
  # height: 1385
  # width: 4080
  # height: 1360
  # width: 7680
  # height: 3176
  ##Enable to maintain aspect ratio wrt source, and allow black borders, works
  ##along with width, height properties
  enable-padding: 0
  nvbuf-memory-type: 0
  sync-inputs: 0

