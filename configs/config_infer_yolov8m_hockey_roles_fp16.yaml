person-roles: {goalie: 1, referee: 2}

pretrained-assets:
  - property: onnx-file
    # Checkpoint redistribution is blocked pending a model-rights record.
    redistributable: false
    url: https://github.com/cjolivier01/HockeyMONStream/releases/download/pretrained-assets-v1/hm_hockey_roles_yolov8_m_1408_544_epoch10-ccbf7dcee597e1ec.onnx
    sha256: ccbf7dcee597e1ec8c1c0f878d578010a0e28f309cf306ed67784a62c304531d
  - property: labelfile-path
    # Runtime consumes this from the per-user detector cache; do not stage a
    # second package copy under /opt.
    redistributable: false
    url: https://github.com/cjolivier01/HockeyMONStream/releases/download/pretrained-assets-v1/hockey_roles_person_goalie_official.txt
    sha256: 0d7db9d98bb41e4381ed751405073fe88e492098b0ec5b9d24d7223970c7c051

property:
  gpu-id: 0
  net-scale-factor: 0.0039215697906911373
  model-color-format: 0
  # Epoch 10: COCO initialized, CrowdHuman + gray hockey; person/goalie/official.
  onnx-file: $HOME/.cache/hstream/models/hm_hockey_roles_yolov8_m_1408_544_epoch10-ccbf7dcee597e1ec.onnx
  # Unlike the BF16 config, nothing has to be built offline: DeepStream's nvinfer
  # builds this from the ONNX on first run and caches it. Do not commit the engine.
  model-engine-file: $HOME/.cache/hstream/models/hm_hockey_roles_yolov8_m_1408_544_epoch10-ccbf7dcee597e1ec.onnx_b2_gpu0_{gpu}_fp16.engine
  labelfile-path: $HOME/.cache/hstream/models/hockey_roles_person_goalie_official.txt
  batch-size: 2
  # 0=FP32, 1=INT8, 2=FP16.
  network-mode: 2
  # Class order is part of the pinned model contract.
  num-detected-classes: 3
  interval: 0
  gie-unique-id: 1
  process-mode: 1
  network-type: 0
  cluster-mode: 2
  maintain-aspect-ratio: 1
  symmetric-padding: 1
  parse-bbox-func-name: NvDsInferParseYolo
  custom-lib-path: libnvdsinfer_custom_impl_Yolo.so

class-attrs-all:
  nms-iou-threshold: 0.45
  pre-cluster-threshold: 0.25
  topk: 300
