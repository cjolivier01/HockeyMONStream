# Explicit opt-in overlay; the selected model downloads/prepares on first use.
# No player-analytics section is needed for ordinary playback.
pipeline:
  player-analytics:
    pose:
      enable: 1
      model: rtmpose-m-coco17-256x192
      rate-hz: 10
      confidence-threshold: 0.3
    max-tracks: 256
    max-due-rois: 32
    batch-size: 8
    track-retention-ms: 2000
