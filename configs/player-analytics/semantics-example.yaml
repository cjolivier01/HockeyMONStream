# Explicit opt-in. Selected models download and prepare automatically on first use.
# Action outputs use the model's generic NTU60 labels, not hockey events.
pipeline:
  tracker:
    reid-enable: true
    reid-model: deepstream # supplied NvDCF model; optional independently of jerseys
  player-analytics:
    pose:
      enable: 1
      model: rtmpose-m-coco17-256x192
      rate-hz: 10
    jersey:
      enable: 1
      model: parseq-hockey-cvprw2024 # CC BY-NC 3.0; noncommercial use
      rate-hz: 2
      confidence-threshold: 0.8
      roi-mode: bbox # pose requires enabled pose and fresh same-frame torso joints
    action:
      enable: 1
      model: stgcnpp-coco2d-joint-ntu60
      rate-hz: 1
      confidence-threshold: 0.5
    team:
      enable: 1
      model: reidentificationnet-deployable-v1.2 # NVIDIA EULA; shared with the tracker ReID
      rate-hz: 2 # Per track, not per frame. A settled track stops being sampled.
      # The configurator fills these three from configs/baseline.yaml, which
      # owns them; they are spelled out here because this file is read on its
      # own and the clusterer has no defaults to fall back on. There is no
      # confidence-threshold: the assignment floor is min-margin.
      warmup-samples: 200
      refit-interval: 600
      min-margin: 0.12
    # Which sweater the home side wore. Omit it and the overlay reads
    # DARK/LIGHT, which is correct but unnamed; there is no way to infer
    # which side is "home" from pixels.
    home-is-dark: true
    max-tracks: 256
    max-due-rois: 32 # Aggregate model samples, not 32 per feature.
    batch-size: 8

# Independent next-run drawing preferences; these do not enable any model.
plot:
  plot_pose: true
  plot_jersey_numbers: true
  plot_actions: true
  plot_individual_player_tracking: true
