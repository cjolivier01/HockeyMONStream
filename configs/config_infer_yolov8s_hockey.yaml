pretrained-assets:
  - property: onnx-file
    # Checkpoint redistribution is blocked pending a model-rights record.
    redistributable: false
    url: https://github.com/cjolivier01/HockeyMONStream/releases/download/pretrained-assets-v1/hm_crowdhuman_e290_yolov8_s_1408_544_dynamic_b1-b2_1408x544.onnx
    sha256: 6d9683021bd62f54b2b730230f5b7d323f6bc98d2c8e03fac5d377e19261c7fe
  - property: labelfile-path
    # Runtime consumes this from the per-user detector cache; do not stage a
    # second package copy under /opt.
    redistributable: false
    url: https://raw.githubusercontent.com/pjreddie/darknet/master/data/coco.names
    sha256: 634a1132eb33f8091d60f2c346ababe8b905ae08387037aed883953b7329af84

property:
  gpu-id: 0
  net-scale-factor: 0.0039215697906911373
  model-color-format: 0
  # Generated by scripts/export_hm_yolov8_onnx.py from the YOLOv8-m to YOLOv8-s
  # distillation. Trained at 1408x544, so it infers at that scale rather than
  # the 1984x736 the YOLOv8-m detector uses.
  onnx-file: $HOME/.cache/hstream/models/hm_crowdhuman_e290_yolov8_s_1408_544_dynamic_b1-b2_1408x544.onnx
  # Generated by DeepStream/TensorRT from the ONNX; do not commit this engine.
  model-engine-file: $HOME/.cache/hstream/models/hm_crowdhuman_e290_yolov8_s_1408_544_dynamic_b1-b2_1408x544.onnx_b2_gpu0_{gpu}_fp32.engine
  labelfile-path: $HOME/.cache/hstream/models/labels_coco.txt
  batch-size: 2
  network-mode: 0
  # The distilled network is person-only, unlike the 80-class default detector.
  num-detected-classes: 1
  interval: 0
  gie-unique-id: 1
  process-mode: 1
  network-type: 0
  cluster-mode: 2
  maintain-aspect-ratio: 1
  symmetric-padding: 1
  parse-bbox-func-name: NvDsInferParseYolo
  custom-lib-path: libnvdsinfer_custom_impl_Yolo.so

class-attrs-all:
  nms-iou-threshold: 0.45
  pre-cluster-threshold: 0.25
  topk: 300
