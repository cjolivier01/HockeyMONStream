sink0:
  enable: 1
  sink-id: 0
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 1
  sync: 1
  # sync: 0
  source-id: 0
  gpu-id: 0
  nvbuf-memory-type: 0

sink1:
  enable: 0
  sink-id: 1
  # Type - 1=FakeSink 2=EglSink 3=File 4=RTSPStreaming
  type: 3
  # link-to-demux: 1
  #1=mp4 2=mkv
  container: 2
  #1=h264 2=h265
  codec: 2
  #encoder type 0=Hardware 1=Software
  enc-type: 0
  sync: 0
  #iframeinterval=10
  bitrate: 55000000
  #H264 Profile - 0=Baseline 2=Main 4=High
  #H265 Profile - 0=Main 1=Main10
  # set profile only for hw encoder, sw encoder selects profile based on sw-preset
  profile: 0
  output-file: out.mp4
  source-id: 0

#
# Initial high-quality streammux
#
streammux:
  gpu-id: 0
  ##Boolean property to inform muxer that sources are live
  live-source: 0
  buffer-pool-size: 4
  batch-size: 4
  num-surfaces-per-frame: 1
  ##time out in usec, to wait after the first buffer is available
  ##to push the batch even if the complete batch is not formed
  # batched-push-timeout: 40000
  ## Set muxer output width and height

  ######################
  # 4k
  ######################
  # width: 3840
  # height: 2160

  ######################
  # Tiny
  ######################
  # width: 1784
  # height: 738

  #width: 8192
  #height: 2770

  ######################
  # GoPro 5k
  ######################
  width: 5312
  height: 2988

  ##Enable to maintain aspect ratio wrt source, and allow black borders, works
  ##along with width, height properties
  enable-padding: 0
  nvbuf-memory-type: 0
  sync-inputs: 0

hmstitcher:
  enable: 1
  # enable: 0
  gpu-id: 0
  configure-only: 1
  nvbuf-memory-type: 0
  plugin-type: hmstitcher
  # config-file: /home/colivier/Videos/mlk-heat-1
  num-batch-buffers: 4
  num-output-buffers: 4
