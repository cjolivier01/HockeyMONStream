sink0:
  enable: 1
  sink-id: 0
  #Type - 1=FakeSink 2=EglSink/nv3dsink (Jetson only) 3=File
  type: 1
  sync: 1
  # sync: 0
  source-id: 0
  gpu-id: 0
  nvbuf-memory-type: 0

#
# Initial high-quality streammux
#
streammux:
  gpu-id: 0
  ##Boolean property to inform muxer that sources are live
  live-source: 0
  buffer-pool-size: 4
  batch-size: 2
  num-surfaces-per-frame: 1
  ##time out in usec, to wait after the first buffer is available
  ##to push the batch even if the complete batch is not formed
  # batched-push-timeout: 40000
  ## Set muxer output width and height

  ######################
  # 4k
  ######################
  # width: 3840
  # height: 2160

  ######################
  # Tiny
  ######################
  # width: 1784
  # height: 738

  #width: 8192
  #height: 2770

  ######################
  # GoPro 5k
  ######################
  # width: 5312
  # height: 2988

  ##Enable to maintain aspect ratio wrt source, and allow black borders, works
  ##along with width, height properties
  enable-padding: 0
  nvbuf-memory-type: 0
  sync-inputs: 0


hmstitcher:
  gpu-id: 0
  configure-only: 1
  nvbuf-memory-type: 0
  plugin-type: hmstitcher
  stitch-auto-adjust-exposure: 0
  # config-file: /home/colivier/Videos/mlk-heat-1
  # Stitching collapses the two camera surfaces into one stitched output surface.
  num-batch-buffers: 1
  num-output-buffers: 4
